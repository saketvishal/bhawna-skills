[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bhawna-skills"
version = "0.1.0"
description = "Reusable guardrails and skills that check AI coding-agent objectives against repository-owned invariants."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Bhawna Skills contributors"}]
keywords = [
  "ai-agents",
  "coding-agents",
  "agentic-ai",
  "llm",
  "developer-tools",
  "guardrails",
  "architecture",
  "spec-driven-development",
  "claude-code",
  "codex",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1.2,<2",
  "types-PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/saketvishal/bhawna-skills"
Repository = "https://github.com/saketvishal/bhawna-skills"
Issues = "https://github.com/saketvishal/bhawna-skills/issues"
Changelog = "https://github.com/saketvishal/bhawna-skills/blob/main/CHANGELOG.md"
Documentation = "https://github.com/saketvishal/bhawna-skills#readme"

[project.scripts]
bhawna = "bhawna_skills.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bhawna_skills = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Argument/Option defaults in the signature.
"src/bhawna_skills/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bhawna_skills"]
mypy_path = "src"
