name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (uv)
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy src
      - name: Tests
        run: uv run pytest --cov=bhawna_skills --cov-report=term-missing
      - name: Demo (config-only)
        run: uv run python examples/run_demo.py
      - name: Build package
        run: uv build
      - name: Installed-artifact CLI smoke
        run: |
          wheel=$(echo dist/*.whl)
          uvx --from "$wheel" bhawna --help
          uvx --from "$wheel" bhawna check examples/sample-project/objectives/use-uv.md \
            --project examples/sample-project --config-only
