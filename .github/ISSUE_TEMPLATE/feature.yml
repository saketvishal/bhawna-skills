name: Feature request
description: Propose a new guardrail, skill, or integration.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: How do you run coding agents today (CLI, IDE, CI)?
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Current agent / tool
      description: e.g. Claude Code, Codex, Cursor, a custom loop.
  - type: input
    id: project_type
    attributes:
      label: Project type
      description: e.g. Python CLI, API, full-stack, AI app.
  - type: textarea
    id: problem
    attributes:
      label: Problem encountered
      description: What failure mode or drift should this solve?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: PASS, REVIEW, BLOCKED, or a new capability.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include command and verdict if applicable.
  - type: textarea
    id: example
    attributes:
      label: Relevant decision / invariant and objective
      description: Redact secrets. Skip if you cannot share.
  - type: textarea
    id: evaluation
    attributes:
      label: How should we evaluate it?
      description: Tests, fixtures, and whether an LLM is required.
  - type: markdown
    attributes:
      value: Do not propose hard-coded phrase matching to make a demo pass. Prefer a Discussion for open-ended ideas.
