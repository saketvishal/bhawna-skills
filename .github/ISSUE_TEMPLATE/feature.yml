name: Feature request
description: Propose a new guardrail, skill, or integration.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failure mode or workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How should we evaluate it?
      description: Tests, fixtures, and whether an LLM is required.
  - type: markdown
    attributes:
      value: Do not propose hard-coded phrase matching to make a demo pass.
