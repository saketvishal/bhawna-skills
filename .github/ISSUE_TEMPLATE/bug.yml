name: Bug report
description: Report incorrect or unexpected InvariantGate or CLI behavior.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include uv commands, configuration with secrets removed, and relevant output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bhawna version or git SHA
  - type: dropdown
    id: mode
    attributes:
      label: Evaluation mode
      options:
        - semantic (BHAWNA_MODEL_URL set)
        - config-only
        - doctor / init
        - packaging / install
