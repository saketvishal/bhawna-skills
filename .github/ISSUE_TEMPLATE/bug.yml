name: Bug report
description: Report incorrect or unexpected behavior.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, configuration with secrets removed, and relevant output.
    validations:
      required: true
